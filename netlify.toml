[build]
  command = ""
  publish = "dist/exploriando/browser"

[build.environment]
  # Tiene que coincidir con .nvmrc: Angular 22 no arranca en Node 20 y el
  # Netlify Build que dispara el CLI fallaba con "Error while running build".
  # El sitio salía igual sólo porque la subida del --dir ocurre antes.
  NODE_VERSION = "22.23.3"
  NPM_VERSION  = "10"

# Netlify Functions
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Proxy API calls to Netlify Functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
