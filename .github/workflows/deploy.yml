name: Deploy Exploriando

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # Deuda técnica de specs resuelta (2026-05-18): 208/208 verdes.
      # Tests vuelven a ser bloqueantes — si fallan, no se deploya.
      - run: npx ng test --watch=false --browsers=ChromeHeadless

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci

      - name: Generar environment.prod.ts desde GitHub Secrets
        run: node scripts/set-env.js
        env:
          EMAILJS_SERVICE_ID:              ${{ secrets.EMAILJS_SERVICE_ID }}
          EMAILJS_NOTIFICATION_TEMPLATE_ID: ${{ secrets.EMAILJS_NOTIFICATION_TEMPLATE_ID }}
          EMAILJS_CONFIRMATION_TEMPLATE_ID_ES: ${{ secrets.EMAILJS_CONFIRMATION_TEMPLATE_ID_ES }}
          EMAILJS_CONFIRMATION_TEMPLATE_ID_EN: ${{ secrets.EMAILJS_CONFIRMATION_TEMPLATE_ID_EN }}
          EMAILJS_PUBLIC_KEY:              ${{ secrets.EMAILJS_PUBLIC_KEY }}

      - name: Build producción
        run: npx ng build --configuration production

      - name: Generar sitemap.xml + robots.txt
        run: node scripts/generate-sitemap.mjs

      - name: Deploy a Netlify
        uses: netlify/actions/cli@master
        with:
          # --functions sube netlify/functions (subscribe, documentacion). Sin
          # esto la function no se deploya y POST /api/subscribe devuelve 404.
          args: deploy --prod --dir=dist/exploriando/browser --functions=netlify/functions
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID:    ${{ secrets.NETLIFY_SITE_ID }}
