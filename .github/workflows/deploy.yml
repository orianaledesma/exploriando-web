name: Deploy Exploriando

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      # Deuda técnica de specs resuelta (2026-05-18): 208/208 verdes.
      # Tests vuelven a ser bloqueantes — si fallan, no se deploya.
      # Vitest sobre jsdom desde Angular 22 — ya no hace falta un Chrome.
      - run: npx ng test --watch=false

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci

      - name: Generar environment.prod.ts desde GitHub Secrets
        run: node scripts/set-env.js
        env:
          EMAILJS_SERVICE_ID:              ${{ secrets.EMAILJS_SERVICE_ID }}
          EMAILJS_NOTIFICATION_TEMPLATE_ID: ${{ secrets.EMAILJS_NOTIFICATION_TEMPLATE_ID }}
          EMAILJS_CONFIRMATION_TEMPLATE_ID_ES: ${{ secrets.EMAILJS_CONFIRMATION_TEMPLATE_ID_ES }}
          EMAILJS_CONFIRMATION_TEMPLATE_ID_EN: ${{ secrets.EMAILJS_CONFIRMATION_TEMPLATE_ID_EN }}
          EMAILJS_PUBLIC_KEY:              ${{ secrets.EMAILJS_PUBLIC_KEY }}

      - name: Build producción
        run: npx ng build --configuration production

      - name: Generar sitemap.xml + robots.txt
        run: node scripts/generate-sitemap.mjs

      # netlify/actions/cli@master devuelve 0 aunque su CLI falle. En el deploy
      # del 2026-10-01 imprimió "Error while running build" y el job quedó en
      # verde; el sitio salió igual sólo porque la subida del --dir ocurre
      # antes del error. Esto corta ese modo de falla silenciosa.
      - name: Verificar que existan los secrets de Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          faltan=""
          [ -z "$NETLIFY_AUTH_TOKEN" ] && faltan="$faltan NETLIFY_AUTH_TOKEN"
          [ -z "$NETLIFY_SITE_ID" ] && faltan="$faltan NETLIFY_SITE_ID"
          if [ -n "$faltan" ]; then
            echo "::error::Faltan secrets:$faltan"
            exit 1
          fi

      # Guarda el nombre con hash del bundle recién construido. Después del
      # deploy se compara contra lo que sirve el dominio: si no coincide, lo
      # publicado no es este build.
      - name: Anotar el artefacto construido
        id: artefacto
        run: |
          main=$(ls dist/exploriando/browser/main-*.js | head -1 | xargs basename)
          echo "main=$main" >> "$GITHUB_OUTPUT"
          echo "Construido: $main"

      # El CLI directo en vez de netlify/actions/cli@master, por dos razones:
      #
      # 1. La action corre en un contenedor Docker sin npm en el PATH. El
      #    plugin @netlify/angular-runtime, que Netlify auto-instala al
      #    detectar Angular, fuerza un `npm run build` que ahí falla con
      #    ENOENT. --no-build lo evita: acá ya construimos en el paso anterior
      #    y lo único que queremos es subir el directorio.
      # 2. La action devuelve exit 0 aunque su CLI falle. Con `run:` el exit
      #    code es el del CLI y el job se pone rojo en el acto.
      #
      # --functions sube netlify/functions (subscribe, documentacion). Sin
      # esto la function no se deploya y POST /api/subscribe devuelve 404.
      - name: Deploy a Netlify
        run: |
          npx --yes netlify-cli@27 deploy \
            --prod \
            --no-build \
            --dir=dist/exploriando/browser \
            --functions=netlify/functions
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID:    ${{ secrets.NETLIFY_SITE_ID }}

      # La verificación que de verdad importa: preguntarle al dominio si está
      # sirviendo ESTE build. Es lo único que no depende de que la action
      # reporte bien su propio resultado.
      - name: Verificar que producción sirva este build
        run: |
          esperado="${{ steps.artefacto.outputs.main }}"
          for i in $(seq 1 12); do
            publicado=$(curl -sL --max-time 20 https://exploriando.page/ \
              | grep -o 'main-[A-Za-z0-9_-]*\.js' | head -1 || true)
            if [ "$publicado" = "$esperado" ]; then
              echo "Producción sirve $publicado — deploy confirmado."
              exit 0
            fi
            echo "intento $i: sirve '$publicado', esperaba '$esperado'"
            sleep 15
          done
          echo "::error::exploriando.page no sirve $esperado. El deploy no llegó."
          exit 1
