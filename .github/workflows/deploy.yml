name: Deploy Exploriando

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx ng test --watch=false --browsers=ChromeHeadless

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci

      - name: Generar environment.prod.ts desde GitHub Secrets
        run: node scripts/set-env.js
        env:
          EMAILJS_SERVICE_ID:              ${{ secrets.EMAILJS_SERVICE_ID }}
          EMAILJS_NOTIFICATION_TEMPLATE_ID: ${{ secrets.EMAILJS_NOTIFICATION_TEMPLATE_ID }}
          EMAILJS_CONFIRMATION_TEMPLATE_ID: ${{ secrets.EMAILJS_CONFIRMATION_TEMPLATE_ID }}
          EMAILJS_PUBLIC_KEY:              ${{ secrets.EMAILJS_PUBLIC_KEY }}

      - name: Build producción
        run: npx ng build --configuration production

      - name: Deploy a Netlify
        uses: netlify/actions/cli@master
        with:
          args: deploy --prod --dir=dist/exploriando/browser
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID:    ${{ secrets.NETLIFY_SITE_ID }}
