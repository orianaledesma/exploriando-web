name: Deploy Exploriando

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: ng test --watch=false --browsers=ChromeHeadless

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Inject environment variables
        run: |
          sed -i "s/serviceId:  ''/serviceId:  '${{ secrets.EMAILJS_SERVICE_ID }}'/" src/environments/environment.prod.ts
          sed -i "s/templateId: ''/templateId: '${{ secrets.EMAILJS_TEMPLATE_ID }}'/" src/environments/environment.prod.ts
          sed -i "s/publicKey:  ''/publicKey:  '${{ secrets.EMAILJS_PUBLIC_KEY }}'/" src/environments/environment.prod.ts
      - run: ng build --configuration production
      - name: Deploy to Netlify
        uses: netlify/actions/cli@master
        with:
          args: deploy --prod --dir=dist/exploriando/browser
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
