<section class="hero" aria-label="Sección principal">
  <div class="hero__overlay" aria-hidden="true"></div>

  <!-- Floating brand orbs (decorative) -->
  <span class="orb" aria-hidden="true" style="width:420px;height:420px;background:rgba(19,118,254,0.18);top:-12%;right:6%;animation-delay:0s"></span>
  <span class="orb" aria-hidden="true" style="width:300px;height:300px;background:rgba(61,217,179,0.12);bottom:6%;right:22%;animation-delay:3s"></span>
  <span class="orb" aria-hidden="true" style="width:200px;height:200px;background:rgba(232,66,122,0.10);top:28%;right:2%;animation-delay:6s"></span>

  <div class="container hero__content">
    <span class="badge badge--fresh hero-enter hero-enter-1">{{ t().eyebrow }}</span>

    <h1 class="hero-enter hero-enter-2 text-metal-white">
      <!-- En la misma línea a propósito: el h1 hereda white-space: pre-line,
           así que un salto acá se renderizaría como salto real y el quiebre
           dejaría de decidirlo el ancho disponible. -->
      {{ t().headlineA }} <em class="hero__headline-accent">{{ t().headlineB }}</em>
    </h1>

    <p class="hero__tagline hero-enter hero-enter-3">{{ t().tagline }}</p>

    <p class="hero__subheadline hero-enter hero-enter-3">{{ t().subheadline }}</p>

    <div class="hero__actions hero-enter hero-enter-4">
      <a [href]="liveUrl"
         class="btn btn--primary btn--lg"
         target="_blank"
         rel="noopener"
         (click)="onLiveClick()"
         data-testid="hero-live">
        {{ t().ctaLive }}
      </a>

      <a routerLink="/mapa"
         class="btn btn--outline btn--lg"
         data-testid="hero-guides">
        {{ t().ctaGuides }}
      </a>
    </div>

    <!-- Social proof -->
    <p class="hero__social-proof hero-enter hero-enter-5">{{ t().socialProof }}</p>
  </div>
</section>
