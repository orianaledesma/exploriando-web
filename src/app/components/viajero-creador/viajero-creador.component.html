<section class="viajero-creador" id="viajero-creador" aria-labelledby="vc-title">
  <div class="container viajero-creador__inner" appReveal>
    <span class="section-label">{{ t().sectionLabel }}</span>
    <h2 id="vc-title">{{ t().teaser.headline }}</h2>
    <p class="viajero-creador__text">{{ t().teaser.text }}</p>
    <a routerLink="/viajero-creador"
       class="btn btn--primary btn--lg"
       (click)="onCtaClick()">
      {{ t().teaser.cta }} →
    </a>
  </div>
</section>
