<section class="apoyo-teaser" id="apoyo" aria-labelledby="apoyo-teaser-title">
  <div class="container apoyo-teaser__inner" appReveal>
    <span class="section-label">{{ t().sectionLabel }}</span>
    <h2 id="apoyo-teaser-title">{{ t().headline }}</h2>
    <p class="apoyo-teaser__text">{{ t().text }}</p>
    <a routerLink="/apoyo"
       class="btn btn--primary btn--lg"
       (click)="onCtaClick()">
      {{ t().cta }} →
    </a>
  </div>
</section>
